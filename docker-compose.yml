# PRISM — hybrid deployment (ADR-015)
#
# Only the heavy compute runs locally in Docker:
#   - backend  : Flask API + the in-process sentence-transformers model
#   - frontend : Next.js standalone server (talks to the backend over this network)
#
# Every stateful service is OFFLOADED to a managed free tier and configured via
# the backend's `.env` (see .env.example):
#   MySQL → Aiven · Postgres+pgvector → Neon · Neo4j → Aura ·
#   Redis → Upstash · Object storage (S3) → Neon Object Storage
#
# The public landing page is a separate static Next.js site in `landing/`,
# deployed on Vercel — it is NOT part of this compose stack.
#
#   docker compose up --build
#   → app on http://localhost:3000
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    # All connection strings + secrets (managed DB/storage URLs, JWT_SECRET,
    # CORS/FRONTEND_URL, S3_* credentials) come straight from .env. Using
    # env_file instead of a hand-maintained whitelist ensures the S3_* vars
    # actually reach boto3 in the container.
    env_file:
      - .env
    environment:
      - PORT=5000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Reach the backend over the compose network (server-side only).
      - API_URL=http://backend:5000
      # The app is served over http://localhost, so the auth cookie must NOT be
      # Secure, otherwise the browser drops it and logins silently fail.
      - COOKIE_SECURE=false
      - NODE_ENV=production
    depends_on:
      - backend
